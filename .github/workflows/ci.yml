name: Kill-Nano checks
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n kill-google-nano.sh
      - name: Static analysis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck kill-google-nano.sh
      - name: Isolated Linux tests
        run: python3 tests/test_linux.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell without running policies
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\kill-google-nano.ps1).Path,
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Out-String | Write-Error; exit 1 }
